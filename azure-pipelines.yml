# Azure Pipelines - BDD/Gherkin + Playwright + Allure (STAGE / Desktop)
# Runs BDD tests written in Gherkin using playwright-bdd
# Credentials are configured in the variable group using the same names as .env

trigger:
  branches:
    include:
      - qa_dc_gherkin

variables:
  - name: HEADLESS
    value: 'true'
  - name: ENV
    value: 'STAGE'

jobs:
  - job: ValidateContracts
    displayName: 'Validate TypeScript and BDD contracts'
    timeoutInMinutes: '15'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '22.x'

      - task: Cache@2
        displayName: 'Cache npm packages'
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          path: '$(HOME)/.npm'

      - script: npm ci
        displayName: 'Install dependencies'

      - script: npm run tsc -- --noEmit
        displayName: 'Validate TypeScript'

      - script: npm audit --audit-level=moderate
        displayName: 'Audit dependencies'

      - script: CI=true npm run bdd:generate
        displayName: 'Validate BDD contracts'
        env:
          STAGE_URL: $(STAGE_URL)

  - job: PrewarmAuthStates
    displayName: 'Prewarm shared authentication states'
    dependsOn: ValidateContracts
    timeoutInMinutes: '15'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '22.x'

      - task: Cache@2
        displayName: 'Cache npm packages'
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          path: '$(HOME)/.npm'

      - script: npm ci
        displayName: 'Install dependencies'

      - task: Cache@2
        displayName: 'Cache Playwright browsers'
        inputs:
          key: 'playwright | "$(Agent.OS)" | package-lock.json'
          path: '$(Pipeline.Workspace)/.cache/ms-playwright'
          cacheHitVar: 'PLAYWRIGHT_CACHE_RESTORED'

      - script: |
          if [ "$(PLAYWRIGHT_CACHE_RESTORED)" != "true" ]; then
            PLAYWRIGHT_BROWSERS_PATH="$(Pipeline.Workspace)/.cache/ms-playwright" npx playwright install --with-deps chromium
          else
            echo "Using cached Playwright Chromium binaries."
          fi
        displayName: 'Install Playwright browsers'

      - script: |
          npx rimraf .auth-state
          CI=true REUSE_AUTH_STATE=true AUTH_STATE_PREWARM_ONLY=true PLAYWRIGHT_BROWSERS_PATH="$(Pipeline.Workspace)/.cache/ms-playwright" npx playwright test --config playwright.bdd.config.ts --project=desktop
        displayName: 'Create shared authentication states'
        env:
          HEADLESS: $(HEADLESS)
          ENV: $(ENV)
          STAGE_URL: $(STAGE_URL)
          GA_PORTAL_STAGE_URL: $(GA_PORTAL_STAGE_URL)
          USER_SUPERADMIN: $(USER_SUPERADMIN)
          USER_SUPERADMIN_PASSWORD: $(USER_SUPERADMIN_PASSWORD)
          USER_PORTALADMIN: $(USER_PORTALADMIN)
          USER_PORTALADMIN_PASSWORD: $(USER_PORTALADMIN_PASSWORD)
          USER_DELOITTEUSER: $(USER_DELOITTEUSER)
          USER_DELOITTEUSER_PASSWORD: $(USER_DELOITTEUSER_PASSWORD)
          USER_CLIENTUSER: $(USER_CLIENTUSER)
          USER_CLIENTUSER_PASSWORD: $(USER_CLIENTUSER_PASSWORD)
          USER_CLIENTUSER_TOTP_SECRET: $(USER_CLIENTUSER_TOTP_SECRET)
          USER_TEAMLEADER: $(USER_TEAMLEADER)
          USER_TEAMLEADER_PASSWORD: $(USER_TEAMLEADER_PASSWORD)
          USER_TEAMLEADER_TOTP_SECRET: $(USER_TEAMLEADER_TOTP_SECRET)
          USER_TEAMMEMBER: $(USER_TEAMMEMBER)
          USER_TEAMMEMBER_PASSWORD: $(USER_TEAMMEMBER_PASSWORD)
          USER_TEAMMEMBER_TOTP_SECRET: $(USER_TEAMMEMBER_TOTP_SECRET)
          USER_CLIENTADMIN: $(USER_CLIENTADMIN)
          USER_CLIENTADMIN_PASSWORD: $(USER_CLIENTADMIN_PASSWORD)
          USER_CLIENTADMIN_TOTP_SECRET: $(USER_CLIENTADMIN_TOTP_SECRET)
          USER_GAPORTAL_CLIENTADMIN: $(USER_GAPORTAL_CLIENTADMIN)
          USER_GAPORTAL_CLIENTADMIN_PASSWORD: $(USER_GAPORTAL_CLIENTADMIN_PASSWORD)
          USER_GAPORTAL_CLIENTUSER: $(USER_GAPORTAL_CLIENTUSER)
          USER_GAPORTAL_CLIENTUSER_PASSWORD: $(USER_GAPORTAL_CLIENTUSER_PASSWORD)

      - task: PublishPipelineArtifact@1
        displayName: 'Publish shared authentication states'
        inputs:
          targetPath: '.auth-state'
          artifact: 'auth-states'
          publishLocation: 'pipeline'

  # Read-only and mutable suites run as independent parallel jobs (separate agents) instead of
  # sequentially in one job. Mutable stays single-worker/serial because scenarios share mutable
  # state (create/edit/delete on the same records), but it no longer waits for read-only to finish.
  - job: RegressionTestsReadOnly
    displayName: 'RA Regression - Read-only (5 workers)'
    dependsOn: PrewarmAuthStates
    timeoutInMinutes: '300'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '22.x'

      - task: Cache@2
        displayName: 'Cache npm packages'
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          path: '$(HOME)/.npm'

      - script: npm ci
        displayName: 'Install dependencies'

      - task: DownloadPipelineArtifact@2
        displayName: 'Download shared authentication states'
        inputs:
          buildType: 'current'
          artifact: 'auth-states'
          path: '$(System.DefaultWorkingDirectory)/.auth-state'

      - script: |
          state_directory=".auth-state/$(printf '%s' "$ENV" | tr '[:upper:]' '[:lower:]')"
          state_count=$(find "$state_directory" -maxdepth 1 -name '*.json' -type f 2>/dev/null | wc -l)
          if [ "$state_count" -lt 1 ]; then
            echo "##vso[task.logissue type=error]The shared authentication-state artifact did not contain state files in $state_directory."
            find .auth-state -type f
            exit 1
          fi
          echo "Using $state_count shared authentication state file(s) from $state_directory."
        displayName: 'Verify shared authentication states'
        env:
          ENV: $(ENV)

      - task: Cache@2
        displayName: 'Cache Playwright browsers'
        inputs:
          key: 'playwright | "$(Agent.OS)" | package-lock.json'
          path: '$(Pipeline.Workspace)/.cache/ms-playwright'
          cacheHitVar: 'PLAYWRIGHT_CACHE_RESTORED'

      - script: |
          if [ "$(PLAYWRIGHT_CACHE_RESTORED)" != "true" ]; then
            PLAYWRIGHT_BROWSERS_PATH="$(Pipeline.Workspace)/.cache/ms-playwright" npx playwright install --with-deps chromium
          else
            echo "Using cached Playwright Chromium binaries."
          fi
        displayName: 'Install Playwright browsers'

      - script: |
          npx rimraf allure-results
          mkdir -p test-results/custom-screenshots
          CI=true npm run bdd:generate

          set +e
          CI=true RETRIES=1 PARALLEL_RUN=true WORKERS=5 RESULTS_GROUP=readonly PLAYWRIGHT_BROWSERS_PATH="$(Pipeline.Workspace)/.cache/ms-playwright" npx playwright test --config playwright.bdd.config.ts --project=desktop --grep @readOnly --workers=5
          readonly_exit=$?

          if [ "$readonly_exit" -ne 0 ]; then
            echo "##vso[task.setvariable variable=bddTestsFailed]true"
            echo "Read-only BDD tests reported failures (exit: $readonly_exit). Review the Allure report and the Tests tab."
          fi

          # The build must stay green even when tests fail; results are reported in the Tests tab and Allure.
          exit 0
        name: ExecuteBddTests
        displayName: 'Execute read-only BDD group (STAGE / Desktop)'
        env:
          REUSE_AUTH_STATE: 'true'
          SHARED_AUTH_STATES: 'true'
          ENV: $(ENV)
          TIMEOUT: '15000'
          TEST_TIMEOUT: '120000'
          TRACE_MODE: 'off'
          SCREENSHOT_FOLDER: 'test-results/custom-screenshots'
          STAGE_URL: $(STAGE_URL)
          GA_PORTAL_STAGE_URL: $(GA_PORTAL_STAGE_URL)
          USER_SUPERADMIN: $(USER_SUPERADMIN)
          USER_SUPERADMIN_PASSWORD: $(USER_SUPERADMIN_PASSWORD)
          USER_PORTALADMIN: $(USER_PORTALADMIN)
          USER_PORTALADMIN_PASSWORD: $(USER_PORTALADMIN_PASSWORD)
          USER_DELOITTEUSER: $(USER_DELOITTEUSER)
          USER_DELOITTEUSER_PASSWORD: $(USER_DELOITTEUSER_PASSWORD)
          USER_CLIENTUSER: $(USER_CLIENTUSER)
          USER_CLIENTUSER_PASSWORD: $(USER_CLIENTUSER_PASSWORD)
          USER_CLIENTUSER_TOTP_SECRET: $(USER_CLIENTUSER_TOTP_SECRET)
          USER_TEAMLEADER: $(USER_TEAMLEADER)
          USER_TEAMLEADER_PASSWORD: $(USER_TEAMLEADER_PASSWORD)
          USER_TEAMLEADER_TOTP_SECRET: $(USER_TEAMLEADER_TOTP_SECRET)
          USER_TEAMMEMBER: $(USER_TEAMMEMBER)
          USER_TEAMMEMBER_PASSWORD: $(USER_TEAMMEMBER_PASSWORD)
          USER_TEAMMEMBER_TOTP_SECRET: $(USER_TEAMMEMBER_TOTP_SECRET)
          USER_CLIENTADMIN: $(USER_CLIENTADMIN)
          USER_CLIENTADMIN_PASSWORD: $(USER_CLIENTADMIN_PASSWORD)
          USER_CLIENTADMIN_TOTP_SECRET: $(USER_CLIENTADMIN_TOTP_SECRET)
          USER_GAPORTAL_CLIENTADMIN: $(USER_GAPORTAL_CLIENTADMIN)
          USER_GAPORTAL_CLIENTADMIN_PASSWORD: $(USER_GAPORTAL_CLIENTADMIN_PASSWORD)
          USER_GAPORTAL_CLIENTUSER: $(USER_GAPORTAL_CLIENTUSER)
          USER_GAPORTAL_CLIENTUSER_PASSWORD: $(USER_GAPORTAL_CLIENTUSER_PASSWORD)

      - script: |
          if [ -d allure-results ] && find allure-results -type f -print -quit | grep -q .; then
            echo "##vso[task.setvariable variable=allureResultsAvailable]true"
            echo "##vso[task.setvariable variable=allureResultsAvailableForPublish;isOutput=true]true"
          else
            echo "##vso[task.setvariable variable=allureResultsAvailable]false"
            echo "##vso[task.setvariable variable=allureResultsAvailableForPublish;isOutput=true]false"
            echo "No Allure results were produced; skipping artifact publication."
          fi
        name: DetectAllureResults
        displayName: 'Detect read-only Allure results'
        condition: always()

      - task: PublishTestResults@2
        displayName: 'Publish Playwright test results'
        condition: always()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit-*.xml'
          searchFolder: '$(System.DefaultWorkingDirectory)'
          mergeTestResults: true
          failTaskOnFailedTests: false
          failTaskOnMissingResultsFile: false
          publishRunAttachments: false
          testRunTitle: 'Playwright BDD - STAGE / Desktop - Read-only'

      - script: npm run diagnostics:prepare
        displayName: 'Prepare sanitized Playwright diagnostics'
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: 'Publish allure-results (read-only)'
        condition: and(always(), eq(variables['allureResultsAvailable'], 'true'))
        inputs:
          targetPath: 'allure-results'
          artifact: 'allure-results-readonly'
          publishLocation: 'pipeline'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Playwright diagnostics (failed runs)'
        condition: eq(variables['bddTestsFailed'], 'true')
        continueOnError: true
        inputs:
          targetPath: 'test-results/diagnostics'
          artifact: 'playwright-test-results-readonly'
          publishLocation: 'pipeline'

  - job: RegressionTestsMutable
    displayName: 'RA Regression - Mutable (1 worker, serial)'
    dependsOn: PrewarmAuthStates
    timeoutInMinutes: '300'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '22.x'

      - task: Cache@2
        displayName: 'Cache npm packages'
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          path: '$(HOME)/.npm'

      - script: npm ci
        displayName: 'Install dependencies'

      - task: DownloadPipelineArtifact@2
        displayName: 'Download shared authentication states'
        inputs:
          buildType: 'current'
          artifact: 'auth-states'
          path: '$(System.DefaultWorkingDirectory)/.auth-state'

      - script: |
          state_directory=".auth-state/$(printf '%s' "$ENV" | tr '[:upper:]' '[:lower:]')"
          state_count=$(find "$state_directory" -maxdepth 1 -name '*.json' -type f 2>/dev/null | wc -l)
          if [ "$state_count" -lt 1 ]; then
            echo "##vso[task.logissue type=error]The shared authentication-state artifact did not contain state files in $state_directory."
            find .auth-state -type f
            exit 1
          fi
          echo "Using $state_count shared authentication state file(s) from $state_directory."
        displayName: 'Verify shared authentication states'
        env:
          ENV: $(ENV)

      - task: Cache@2
        displayName: 'Cache Playwright browsers'
        inputs:
          key: 'playwright | "$(Agent.OS)" | package-lock.json'
          path: '$(Pipeline.Workspace)/.cache/ms-playwright'
          cacheHitVar: 'PLAYWRIGHT_CACHE_RESTORED'

      - script: |
          if [ "$(PLAYWRIGHT_CACHE_RESTORED)" != "true" ]; then
            PLAYWRIGHT_BROWSERS_PATH="$(Pipeline.Workspace)/.cache/ms-playwright" npx playwright install --with-deps chromium
          else
            echo "Using cached Playwright Chromium binaries."
          fi
        displayName: 'Install Playwright browsers'

      - script: |
          npx rimraf allure-results
          mkdir -p test-results/custom-screenshots
          CI=true npm run bdd:generate

          set +e
          # Retries are disabled because this serial suite showed persistent failures in the retry run.
          CI=true RETRIES=0 PARALLEL_RUN=false WORKERS=1 RESULTS_GROUP=mutable PLAYWRIGHT_BROWSERS_PATH="$(Pipeline.Workspace)/.cache/ms-playwright" npx playwright test --config playwright.bdd.config.ts --project=desktop --grep @mutable --workers=1
          mutable_exit=$?

          if [ "$mutable_exit" -ne 0 ]; then
            echo "##vso[task.setvariable variable=bddTestsFailed]true"
            echo "Mutable BDD tests reported failures (exit: $mutable_exit). Review the Allure report and the Tests tab."
          fi

          # The build must stay green even when tests fail; results are reported in the Tests tab and Allure.
          exit 0
        name: ExecuteBddTests
        displayName: 'Execute mutable BDD group (STAGE / Desktop)'
        env:
          REUSE_AUTH_STATE: 'true'
          SHARED_AUTH_STATES: 'true'
          ENV: $(ENV)
          TIMEOUT: '15000'
          TEST_TIMEOUT: '120000'
          TRACE_MODE: 'off'
          SCREENSHOT_FOLDER: 'test-results/custom-screenshots'
          STAGE_URL: $(STAGE_URL)
          GA_PORTAL_STAGE_URL: $(GA_PORTAL_STAGE_URL)
          USER_SUPERADMIN: $(USER_SUPERADMIN)
          USER_SUPERADMIN_PASSWORD: $(USER_SUPERADMIN_PASSWORD)
          USER_PORTALADMIN: $(USER_PORTALADMIN)
          USER_PORTALADMIN_PASSWORD: $(USER_PORTALADMIN_PASSWORD)
          USER_DELOITTEUSER: $(USER_DELOITTEUSER)
          USER_DELOITTEUSER_PASSWORD: $(USER_DELOITTEUSER_PASSWORD)
          USER_CLIENTUSER: $(USER_CLIENTUSER)
          USER_CLIENTUSER_PASSWORD: $(USER_CLIENTUSER_PASSWORD)
          USER_CLIENTUSER_TOTP_SECRET: $(USER_CLIENTUSER_TOTP_SECRET)
          USER_TEAMLEADER: $(USER_TEAMLEADER)
          USER_TEAMLEADER_PASSWORD: $(USER_TEAMLEADER_PASSWORD)
          USER_TEAMLEADER_TOTP_SECRET: $(USER_TEAMLEADER_TOTP_SECRET)
          USER_TEAMMEMBER: $(USER_TEAMMEMBER)
          USER_TEAMMEMBER_PASSWORD: $(USER_TEAMMEMBER_PASSWORD)
          USER_TEAMMEMBER_TOTP_SECRET: $(USER_TEAMMEMBER_TOTP_SECRET)
          USER_CLIENTADMIN: $(USER_CLIENTADMIN)
          USER_CLIENTADMIN_PASSWORD: $(USER_CLIENTADMIN_PASSWORD)
          USER_CLIENTADMIN_TOTP_SECRET: $(USER_CLIENTADMIN_TOTP_SECRET)
          USER_GAPORTAL_CLIENTADMIN: $(USER_GAPORTAL_CLIENTADMIN)
          USER_GAPORTAL_CLIENTADMIN_PASSWORD: $(USER_GAPORTAL_CLIENTADMIN_PASSWORD)
          USER_GAPORTAL_CLIENTUSER: $(USER_GAPORTAL_CLIENTUSER)
          USER_GAPORTAL_CLIENTUSER_PASSWORD: $(USER_GAPORTAL_CLIENTUSER_PASSWORD)

      - script: |
          if [ -d allure-results ] && find allure-results -type f -print -quit | grep -q .; then
            echo "##vso[task.setvariable variable=allureResultsAvailable]true"
            echo "##vso[task.setvariable variable=allureResultsAvailableForPublish;isOutput=true]true"
          else
            echo "##vso[task.setvariable variable=allureResultsAvailable]false"
            echo "##vso[task.setvariable variable=allureResultsAvailableForPublish;isOutput=true]false"
            echo "No Allure results were produced; skipping artifact publication."
          fi
        name: DetectAllureResults
        displayName: 'Detect mutable Allure results'
        condition: always()

      - task: PublishTestResults@2
        displayName: 'Publish Playwright test results'
        condition: always()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit-*.xml'
          searchFolder: '$(System.DefaultWorkingDirectory)'
          mergeTestResults: true
          failTaskOnFailedTests: false
          failTaskOnMissingResultsFile: false
          publishRunAttachments: false
          testRunTitle: 'Playwright BDD - STAGE / Desktop - Mutable'

      - script: npm run diagnostics:prepare
        displayName: 'Prepare sanitized Playwright diagnostics'
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: 'Publish allure-results (mutable)'
        condition: and(always(), eq(variables['allureResultsAvailable'], 'true'))
        inputs:
          targetPath: 'allure-results'
          artifact: 'allure-results-mutable'
          publishLocation: 'pipeline'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Playwright diagnostics (failed runs)'
        condition: eq(variables['bddTestsFailed'], 'true')
        continueOnError: true
        inputs:
          targetPath: 'test-results/diagnostics'
          artifact: 'playwright-test-results-mutable'
          publishLocation: 'pipeline'

  - job: PublishResults
    displayName: 'Merge Allure results and publish report'
    dependsOn:
      - ValidateContracts
      - RegressionTestsReadOnly
      - RegressionTestsMutable
    condition: and(succeeded('ValidateContracts'), eq(dependencies.RegressionTestsReadOnly.outputs['DetectAllureResults.allureResultsAvailableForPublish'], 'true'), eq(dependencies.RegressionTestsMutable.outputs['DetectAllureResults.allureResultsAvailableForPublish'], 'true'), always())
    timeoutInMinutes: '30'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseNode@1
        displayName: 'Install Node.js'
        inputs:
          version: '22.x'

      - task: Cache@2
        displayName: 'Cache npm packages'
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          path: '$(HOME)/.npm'

      - task: JavaToolInstaller@0
        displayName: 'Install Java 21'
        inputs:
          versionSpec: '21'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - script: npm ci
        displayName: 'Install dependencies'

      - task: DownloadPipelineArtifact@2
        displayName: 'Download allure-results (read-only)'
        condition: always()
        continueOnError: true
        inputs:
          buildType: 'current'
          artifact: 'allure-results-readonly'
          path: '$(Pipeline.Workspace)/allure-results-readonly'

      - task: DownloadPipelineArtifact@2
        displayName: 'Download allure-results (mutable)'
        condition: always()
        continueOnError: true
        inputs:
          buildType: 'current'
          artifact: 'allure-results-mutable'
          path: '$(Pipeline.Workspace)/allure-results-mutable'

      - script: |
          mkdir -p allure-results
          if [ -d "$(Pipeline.Workspace)/allure-results-readonly" ]; then
            cp -R "$(Pipeline.Workspace)/allure-results-readonly/." allure-results/
          fi
          if [ -d "$(Pipeline.Workspace)/allure-results-mutable" ]; then
            cp -R "$(Pipeline.Workspace)/allure-results-mutable/." allure-results/
          fi
        displayName: 'Merge allure-results from both jobs'
        condition: always()

      - script: |
          organization_url="$(System.CollectionUri)"
          builds_url="${organization_url}$(System.TeamProject)/_apis/build/builds?definitions=$(System.DefinitionId)&branchName=$(Build.SourceBranch)&statusFilter=completed&queryOrder=finishTimeDescending&%24top=50&api-version=7.1"
          set +e
          builds=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
            "$builds_url")
          builds_exit=$?
          set -e

          if [ "$builds_exit" -ne 0 ]; then
            echo "Could not query previous builds; generating a fresh Allure history."
            exit 0
          fi

          history_build_id=$(printf '%s' "$builds" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const builds = JSON.parse(body).value || [];
              const token = process.env.SYSTEM_ACCESSTOKEN;
              const baseUrl = process.env.SYSTEM_COLLECTIONURI;
              const project = process.env.SYSTEM_TEAMPROJECT;

              (async () => {
                for (const build of builds) {
                  const response = await fetch(`${baseUrl}${project}/_apis/build/builds/${build.id}/artifacts?artifactName=allure-history&api-version=7.1`, {
                    headers: { Authorization: `Bearer ${token}` },
                  });
                  if (response.ok) {
                    process.stdout.write(String(build.id));
                    return;
                  }
                }
              })().catch(error => {
                console.error(`Could not inspect Allure history artifacts: ${error.message}`);
              });
            });
          ')

          if [ -n "$history_build_id" ]; then
            echo "Restoring Allure history from build $history_build_id."
            echo "##vso[task.setvariable variable=allureHistoryBuildId]$history_build_id"
          else
            echo "No Allure history artifact exists for this branch yet; generating a fresh history."
          fi
        displayName: 'Find latest branch build with Allure history'
        condition: always()
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECT: $(System.TeamProject)

      - task: DownloadPipelineArtifact@2
        displayName: 'Restore Allure history from the latest branch build'
        condition: and(always(), ne(variables['allureHistoryBuildId'], ''))
        inputs:
          buildType: 'specific'
          project: '$(System.TeamProject)'
          pipeline: '$(System.DefinitionId)'
          buildVersionToDownload: 'specific'
          pipelineId: '$(allureHistoryBuildId)'
          allowPartiallySucceededBuilds: true
          allowFailedBuilds: true
          artifact: 'allure-history'
          path: '$(Pipeline.Workspace)/allure-history'

      - script: |
          if [ -d "$(Pipeline.Workspace)/allure-history" ]; then
            mkdir -p allure-results/history
            cp -R "$(Pipeline.Workspace)/allure-history/." allure-results/history/
          fi
        displayName: 'Restore Allure history into test results'
        condition: always()

      - script: npm run allure:generate
        displayName: 'Generate Allure report and history'
        condition: always()
        env:
          ENV: $(ENV)
          STAGE_URL: $(STAGE_URL)
          WORKERS: '4'
          PARALLEL_RUN: 'false'
          RETRIES: '0'

      - script: |
          summary_file="$(System.DefaultWorkingDirectory)/test-results/analysis/allure-quality-summary.md"
          if [ -f "$summary_file" ]; then
            echo "##vso[task.uploadsummary]$summary_file"
          else
            echo "Allure quality summary was not generated."
          fi
        displayName: 'Publish automation and application quality summary'
        condition: always()

      - task: PublishAllureReport@1
        displayName: 'Publish Allure Report tab (BDD)'
        condition: always()
        inputs:
          testResultsDir: '$(System.DefaultWorkingDirectory)/allure-results'
          reportName: 'Allure Report - Playwright BDD'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Allure history for the next build'
        condition: always()
        continueOnError: true
        inputs:
          targetPath: 'allure-report/history'
          artifact: 'allure-history'
          publishLocation: 'pipeline'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Allure quality analysis'
        condition: always()
        continueOnError: true
        inputs:
          targetPath: 'test-results/analysis'
          artifact: 'allure-quality-analysis'
          publishLocation: 'pipeline'
